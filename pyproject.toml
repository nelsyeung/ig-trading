[project]
authors = [
    { name = "Nelson Yeung", email = "nelsyeung@gmail.com" },
]
name = "ig-trading"
version = "0.0.0"
description = "IG trading"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp[speedups]>=3.14.3",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "typing-extensions>=4.16.0",
]

[project.urls]
Changelog = "https://github.com/nelsyeung/ig-trading/blob/main/CHANGELOG.md"
Documentation = "https://ig-trading.readthedocs.io"
Issues = "https://github.com/nelsyeung/ig-trading/issues"
Repository = "https://github.com/nelsyeung/ig-trading.git"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.16.1",
    "furo>=2025.12.19",
    "mypy>=2.3.1",
    "pytest-asyncio>=1.4.0",
    "pytest-randomly>=5.0.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "sphinx-copybutton>=0.5.2",
    "sphinx-inline-tabs>=2025.12.21.14",
    "sphinx>=8.1.3",
    "types-requests>=2.33.0.20260906",
]

[tool.coverage.report]
exclude_also = ["if t.TYPE_CHECKING:"]
fail_under = 95
show_missing = true
skip_covered = true

[tool.coverage.run]
source = ["src/_ig_trading"]

[tool.mypy]
show_error_codes = true

[tool.pytest.ini_options]
addopts = [
  "--asyncio-mode=auto",
  "--strict-markers",
  "-ra",
]
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 79
namespace-packages = ["scripts"]

[tool.ruff.lint]
ignore = ["COM812", "CPY001", "D107", "PLR0913", "PLR0917"]
select = ["ALL"]

[tool.ruff.lint.flake8-import-conventions.aliases]
asyncio = "aio"
datetime = "dt"
functools = "ft"
typing_extensions = "t"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
exempt-modules = [
  "typing",
  "typing_extensions",
]
runtime-evaluated-base-classes = [
  "_ig_trading.model.Model",
  "_ig_trading.positions.v1.Market",
  "_ig_trading.prices.v1.Price",
  "pydantic.BaseModel",
]
strict = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"docs/conf.py" = ["F403", "F405", "INP001"]
"tests/**" = ["D", "S", "SLF"]

[tool.uv.build-backend]
module-name = ["_ig_trading", "ig_trading"]
